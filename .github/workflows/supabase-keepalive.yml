name: Supabase keep-alive

# Free-tier Supabase projects are paused after 7 days without activity.
# This pings the database once a day through the Data API so that never
# happens. It calls public.keepalive() (supabase/migrations/
# 20260926020000_keepalive_rpc.sql), which just returns now() and is the
# only thing anon can execute.
#
# Uses the same repo secrets as deploy.yml (public anon/publishable key only,
# never the service_role key).
#
# Note: GitHub disables scheduled workflows after 60 days without repository
# activity. If that happens, re-enable it from the Actions tab.

on:
  schedule:
    - cron: '17 9 * * *' # daily, 09:17 UTC (06:17 BRT)
  workflow_dispatch:

permissions: {}

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase database
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY repo secrets are not set"
            exit 1
          fi
          url="${SUPABASE_URL%/}/rest/v1/rpc/keepalive"
          headers=(-H "apikey: ${SUPABASE_ANON_KEY}" -H "Content-Type: application/json")
          # Legacy anon keys are JWTs and may also go in Authorization.
          # New sb_publishable_ keys must only be sent as apikey.
          case "$SUPABASE_ANON_KEY" in
            eyJ*) headers+=(-H "Authorization: Bearer ${SUPABASE_ANON_KEY}") ;;
          esac
          response=$(curl -sS --fail-with-body --max-time 30 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            -X POST "${headers[@]}" -d '{}' "$url")
          echo "Database responded: $response"
